<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Computing Student Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one page students bookmark. Pick your year, then open today's lab or a revision site. Year colours are wayfinding only. */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --ink:#15212c; --muted:#56687a; --line:#d4dde5; --accent:#2f5bd3;
  --y7:#3a6fe0; --y8:#c27a00; --y9:#1f8a4c; --y10:#8a46c2; --py:#0e8f8a;
  --display:"Schibsted Grotesk","Segoe UI",Arial,sans-serif; --body:"Atkinson Hyperlegible","Segoe UI",Arial,sans-serif; --mono:"JetBrains Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1720; --panel:#17222d; --ink:#e6edf3; --muted:#9fb0c0; --line:#2a3a49; --accent:#7ea2ff;
  --y7:#7ea2ff; --y8:#f0b84a; --y9:#5fd08e; --y10:#c18cf0; --py:#37c2bc; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:clamp(28px,4.5vw,40px);font-weight:800}
h2{font-size:24px;font-weight:800;display:flex;align-items:center;gap:10px}
h3{font-size:18px;font-weight:600}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted);max-width:65ch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:15px;font-weight:700;background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.year{display:grid;gap:12px}
.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px}
.unit{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px;align-content:start;min-width:0}
.unit .meta{font-size:14px;color:var(--muted)}
.res{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.title{display:flex;gap:8px;align-items:baseline;min-width:0;flex:1 1 170px;font-weight:700}
.tag{font-family:var(--mono);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;flex:none}
.btn{font-size:15px;font-weight:700;border-radius:8px;padding:6px 14px;background:var(--accent);color:var(--panel);text-decoration:none;display:inline-block}
.lessons{display:flex;flex-wrap:wrap;gap:6px}
.lesson{font-size:14px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--bg);color:var(--ink);text-decoration:none}
.lesson:hover,.btn:hover{filter:brightness(1.08)}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.foot{font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header style="display:grid;gap:6px">
    <div class="eyebrow">Computing</div>
    <h1>Computing Student Hub</h1>
    <p class="lead">Choose your year. Open today's lab in your lesson, or use the revision sites to get ready for your tests.</p>
  </header>
  <div class="chips" id="filters" role="group" aria-label="Choose your year"></div>
  <main id="list" style="display:grid;gap:26px"></main>
  <p class="foot">Can't open a page? Tell your teacher.</p>
</div>
<script>
const A=id=>id.startsWith("http")||id.endsWith(".html")?id:"https://claude.ai/artifact/"+id;
const YEARS=[["y7","Year 7","--y7"],["y8","Year 8","--y8"],["y9","Year 9","--y9"],["y10","Year 10","--y10"],["py","Python activities","--py"]];
const DATA=[
 {y:"y7",name:"Scratch",meta:"Revision",res:[["Scratch quiz and flashcards","Revision","2vcntUxfUQyHVu9MjESrLD"],["Scratch 40-minute revision task","Revision","Nnheqb2o4P4siHLj71MJT9"]]},
 {y:"y8",name:"micro:bit",meta:"Revision",res:[["micro:bit quiz and flashcards","Revision","TJ19fRJo5LyzSZ1vCu4C4t"],["micro:bit 40-minute revision task","Revision","3FmgAbo6XatSSZeRAHrvpR"]]},
 {y:"y8",name:"Networks & Cyber Security",meta:"Lesson labs and revision",res:[
   ["Cyber Lab","Lab","MtnfWd6EwTtpJkANUDpUfm",[["1 Packet Journey","packets"],["2 Network Builder","builder"],["3 Binary Lab","binary"],["4 Hacker Hats","hats"],["5 Phish Spotter","phish"],["6 Cipher Lab","cipher"],["7 Password Lab","password"]]],
   ["Cyber Agent Mission","Lab","6hiMzKz7bjnCbtT7eJiQ6D"],["Cyber Revision","Revision","NtKnc46RjeUZdd1nyVSf5g"]]},
 {y:"y9",name:"Bebras: The Wolf Vault",meta:"Escape-room puzzles",res:[["The Wolf Vault","Lesson","S82jhu4N8RC7YCyD9Uz6Se"]]},
 {y:"y9",name:"Python Turtle",meta:"Activities and revision",res:[["Python Turtle activities (flags, Mondrian…)","Activities","turtle.html"],["Python Turtle quiz and flashcards","Revision","Ns4pN8bNT56udRfsRvcegW"],["Python Turtle 40-minute revision task","Revision","ErqqiZmnaH6ucDM12QyVSo"]]},
 {y:"y9",name:"What's inside a computer?",meta:"Lesson labs and revision",res:[
   ["Hardware Lab","Lab","VgSjoDPSQyqrKTgVw2D3if",[["1 Inside the Box","box"],["2 Wolf CPU","cpu"],["3 Memory Lab","memory"],["4 Storage Lab","storage"],["5 Cloud Lab","cloud"],["6 Data Centre Lab","dc"],["7 PC Builder","builder"]]],
   ["Hardware Revision","Revision","PLG5btk4AM8e62eCVogChY"]]},
 {y:"y10",name:"Key terms",meta:"Revision",res:[["Key Terms quiz and flashcards","Revision","EQtnCiYSxTMwZdJTyKuQEa"],["Key Terms 40-minute revision task","Revision","DurGJR8FTS5zJ5NAomni6P"]]},
 {y:"py",name:"Python debug activities",meta:"Find the bug, fix it, then extend it",res:[["Debug activities","Activities","debug.html"]]},
];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let YF="all";try{YF=localStorage.getItem("hub-year")||"all";}catch(e){}
const ext=u=>u.startsWith("http")?' target="_blank" rel="noopener"':"";
function render(){
  $("filters").innerHTML=[["all","All",""]].concat(YEARS).map(([k,n,c])=>`<button class="chip" data-y="${k}" aria-pressed="${YF===k}">${c?`<span class="dot" style="--c:var(${c})"></span>`:""}${n}</button>`).join("");
  $("list").innerHTML=YEARS.filter(([k])=>YF==="all"||YF===k).map(([k,name,c])=>`<section class="year"><h2><span class="dot" style="--c:var(${c})"></span>${name}</h2><div class="units">${
    DATA.filter(u=>u.y===k).map(u=>`<article class="unit"><div><h3>${esc(u.name)}</h3><p class="meta">${esc(u.meta)}</p></div>${u.res.map(([t,tag,id,ls])=>{const url=A(id);return `<div class="res">
      <div class="row"><div class="title">${esc(t)} <span class="tag">${esc(tag)}</span></div><a class="btn" href="${url}"${ext(url)}>Open</a></div>
      ${ls?`<div class="lessons">${ls.map(([lt,h])=>`<a class="lesson" href="${url}#${h}"${ext(url)}>${esc(lt)}</a>`).join("")}</div>`:""}</div>`;}).join("")}</article>`).join("")}</div></section>`).join("");}
document.addEventListener("click",e=>{const f=e.target.closest("[data-y]");if(!f)return;YF=f.dataset.y;try{localStorage.setItem("hub-year",YF);}catch(err){}render();});
render();
</script>
</body>
</html>
