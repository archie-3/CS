<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Year 10 Key Terms – quiz and flashcards</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#1E2433; --muted:#566074; --paper:#F4F6FA; --card:#FCFDFE; --line:#D9DEE8;
  --accent:#4338CA; --tint:#E6E4FA; --on-accent:#FCFDFE;
  --good:#1F6FB2; --good-bg:#E3EFFA; --bad:#B4530B; --bad-bg:#FCEBDC;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E9ECF3; --muted:#A7AFC0; --paper:#141925; --card:#1C2231; --line:#2E3647;
    --accent:#A5A0F5; --tint:#252D3E; --on-accent:#141925;
    --good:#7DB8EC; --good-bg:#1C2B3D; --bad:#F2A767; --bad-bg:#3A2A1C;
  }
}
:root[data-theme="dark"]{
  --ink:#E9ECF3; --muted:#A7AFC0; --paper:#141925; --card:#1C2231; --line:#2E3647;
  --accent:#A5A0F5; --tint:#252D3E; --on-accent:#141925;
  --good:#7DB8EC; --good-bg:#1C2B3D; --bad:#F2A767; --bad-bg:#3A2A1C;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.55 "Atkinson Hyperlegible",Verdana,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:28px 20px 56px}
header{border-left:6px solid var(--accent);padding:4px 0 4px 16px;margin-bottom:24px}
h1{font:700 clamp(28px,6vw,40px)/1.1 Rubik,Arial,sans-serif;margin:0 0 6px}
header p{margin:0;color:var(--muted)}
.tabs{display:flex;gap:8px;margin-bottom:20px}
.tab{flex:1;font:600 17px Rubik,Arial,sans-serif;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}
.progress{height:8px;background:var(--tint);border-radius:8px;overflow:hidden;margin-bottom:16px}
.progress span{display:block;height:100%;background:var(--accent);transition:width .3s}
.qnum{color:var(--muted);font-size:15px;margin:0 0 6px}
.q{font:600 22px/1.35 Rubik,Arial,sans-serif;margin:0 0 16px}
pre{background:var(--tint);border-radius:10px;padding:12px 14px;overflow-x:auto;font:16px/1.5 "Courier New",monospace;margin:0 0 16px;white-space:pre}
.opts{display:grid;gap:10px}
.opt{text-align:left;font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.fb{margin-top:16px;padding:14px 16px;border-radius:12px;display:none}
.fb.show{display:block}
.fb.right{background:var(--good-bg);border-left:5px solid var(--good)}
.fb.wrong{background:var(--bad-bg);border-left:5px solid var(--bad)}
.fb b{display:block;margin-bottom:4px}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.btn{font:600 17px Rubik,Arial,sans-serif;padding:12px 20px;border-radius:12px;border:none;background:var(--accent);color:var(--on-accent);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn[hidden]{display:none}
.score{font:700 64px/1 Rubik,Arial,sans-serif;color:var(--accent);margin:8px 0}
.list{padding-left:20px}
.card{min-height:260px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px;border-radius:16px;background:var(--tint);cursor:pointer;border:2px solid transparent;width:100%;font:inherit;color:var(--ink)}
.card .term{font:700 clamp(28px,7vw,40px)/1.15 Rubik,Arial,sans-serif}
.card .hint{color:var(--muted);font-size:15px;margin-top:14px}
.card .def{font-size:20px}
.card .ex{margin-top:14px;color:var(--muted)}
.count{text-align:center;color:var(--muted);margin-top:12px}
.tabs{flex-wrap:wrap}
.tab{min-width:120px}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;padding:14px;background:var(--tint);border-radius:12px}
.bank span{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-weight:700}
.sents{padding-left:24px;margin:0;display:grid;gap:14px}
.sents li{line-height:2.1}
.sents select{font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:8px;padding:2px 6px;max-width:100%}
.sents select.right{border-color:var(--good);background:var(--good-bg)}
.sents select.wrong{border-color:var(--bad);background:var(--bad-bg)}
.say{font:inherit;background:none;border:none;cursor:pointer;padding:0 4px;color:var(--accent)}
@media (prefers-reduced-motion:reduce){.progress span{transition:none}}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.card .ex{white-space:pre-wrap;font-family:"JetBrains Mono",Consolas,monospace;font-size:15px;text-align:left}
</style>

<div class="wrap">
  <header>
    <h1>Year 10 key terms revision</h1>
    <p>Answer each question. You will see if you are right straight away.</p>
  </header>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tQuiz" aria-selected="true">Quiz</button>
    <button class="tab" role="tab" id="tCards" aria-selected="false">Flashcards</button>
    <button class="tab" role="tab" id="tGaps" aria-selected="false">Fill the gaps</button>
  </div>

  <section class="panel" id="quiz"></section>

  <section class="panel" id="cards" hidden>
    <button class="card" id="card" aria-live="polite"></button>
    <p class="count" id="cardCount"></p>
    <div class="row" style="justify-content:space-between">
      <button class="btn ghost" id="prev">Back</button>
      <button class="btn ghost" id="shuf">Shuffle</button>
      <button class="btn" id="next">Next card</button>
    </div>
  </section>

  <section class="panel" id="gaps" hidden>
    <div class="sets" id="gapSets" role="group" aria-label="Choose a set"></div>
      <p class="qnum">Word bank</p>
    <div class="bank" id="bank"></div>
    <ol class="sents" id="sents"></ol>
    <div class="fb" id="gapFb" aria-live="polite"></div>
    <div class="row">
      <button class="btn ghost" id="gapReset">Start again</button>
      <button class="btn ghost" id="gapShow">Show answers</button>
      <button class="btn" id="gapCheck">Check my answers</button>
    </div>
  </section>
</div>

<script>
const DATA = {"questions": [{"topic": "Algorithm", "q": "What is an algorithm?", "options": ["A sequence of instructions that solves a problem or completes a task", "A programming language", "A diagram with boxes and arrows", "A type of data"], "why": "An algorithm is the steps. It can be written as pseudocode, a flowchart or code."}, {"topic": "Decomposition", "q": "Breaking a big problem into smaller sub-problems is called…", "options": ["Decomposition", "Abstraction", "Iteration", "Concatenation"], "why": "Decomposition breaks a problem into smaller parts that are easier to solve."}, {"topic": "Abstraction", "q": "A metro map shows the stations but not every street. This is an example of…", "options": ["Abstraction", "Decomposition", "Selection", "Assignment"], "why": "Abstraction removes details that are not needed."}, {"topic": "Pseudocode", "q": "What is pseudocode?", "options": ["Writing an algorithm in simple English-like instructions", "Code written in binary", "A diagram with shapes and arrows", "A table used to follow a program"], "why": "Pseudocode is not a real programming language. It is easy for people to read."}, {"topic": "Flowchart", "q": "In a flowchart, what does a diamond shape show?", "options": ["A decision (a yes/no question)", "The start or end", "An input or output", "A process"], "why": "A diamond is a decision: the flowchart goes one way for yes and another way for no."}, {"topic": "Trace table", "q": "What is a trace table used for?", "options": ["Following a program step by step to check what it does", "Storing data in a database", "Sorting a list", "Drawing a flowchart"], "why": "A trace table records the value of each variable at each step."}, {"topic": "Efficiency (of an algorithm)", "q": "Algorithm A needs 50 steps. Algorithm B needs 8 steps for the same task. Which is more efficient?", "options": ["Algorithm B", "Algorithm A", "They are the same", "You cannot tell"], "why": "A more efficient algorithm needs fewer steps."}, {"topic": "Linear search", "q": "A linear search looks for 40 in this list. How many items does it check?", "options": ["7", "1", "3", "4"], "why": "A linear search checks every item from the start. 40 is the 7th item.", "code": "[3, 8, 12, 20, 25, 31, 40]"}, {"topic": "Binary search", "q": "What must be true about a list before you can use a binary search?", "options": ["It must be sorted", "It must contain only strings", "It must have fewer than 10 items", "It must contain no repeats"], "why": "Binary search checks the middle item and ignores half the list, so the list must be in order."}, {"topic": "Binary search", "q": "A binary search looks for 25 in this sorted list. Which item does it check FIRST?", "options": ["20 (the middle item)", "3 (the first item)", "40 (the last item)", "25"], "why": "Binary search always starts with the middle item.", "code": "[3, 8, 12, 20, 25, 31, 40]"}, {"topic": "Data type", "q": "What is a data type?", "options": ["It tells the computer what kind of value is stored", "The name of a variable", "A loop that repeats", "A symbol that compares two values"], "why": "Examples of data types: integer, float, Boolean, character, string."}, {"topic": "Integer", "q": "Which value is an integer?", "options": ["-3", "3.5", "\"3\"", "True"], "why": "An integer is a whole number with no decimal point. \"3\" in quotes is a string."}, {"topic": "Real number /float", "q": "What data type is 9.99 in Python?", "options": ["float", "integer", "Boolean", "string"], "why": "A number with a decimal point is a real number. Python calls it a float."}, {"topic": "Boolean", "q": "Which values can a Boolean have?", "options": ["Only True or False", "Any whole number", "Any text", "Only 0 to 9"], "why": "A Boolean can only be True or False."}, {"topic": "Character", "q": "Which of these is a single character?", "options": ["'7'", "\"Hello\"", "3.14", "True"], "why": "A character is one letter, digit or symbol."}, {"topic": "String", "q": "What data type is \"Hello\"?", "options": ["string", "integer", "character", "Boolean"], "why": "A string is a sequence of characters: text."}, {"topic": "String", "q": "In Python, what data type does input() always give you?", "options": ["string", "integer", "float", "Boolean"], "why": "input() always gives a string. Use int() to change it into an integer."}, {"topic": "Variable", "q": "What is a variable?", "options": ["A named place in memory whose value CAN change", "A value that can never change", "A loop", "A type of search"], "why": "A variable stores a value that can change while the program runs."}, {"topic": "Variable", "q": "What does this program print?", "options": ["7", "5", "2", "x + 2"], "why": "x starts as 5. Then x = x + 2 changes it to 7.", "code": "x = 5\nx = x + 2\nprint(x)"}, {"topic": "Constant", "q": "What is a constant?", "options": ["A named value that stays the SAME for the whole program", "A value that changes every loop", "A type of loop", "Text joined together"], "why": "Use a constant for values that never change, like VAT_RATE = 0.07."}, {"topic": "Assignment", "q": "Which line is an assignment?", "options": ["score = 0", "print(score)", "if score > 10:", "for i in range(5):"], "why": "Assignment gives a variable a value using ="}, {"topic": "Sequence", "q": "Instructions that run one after another, in the order they are written, are called…", "options": ["Sequence", "Selection", "Iteration", "Abstraction"], "why": "Sequence: line 1, then line 2, then line 3."}, {"topic": "Selection", "q": "Which line uses selection?", "options": ["if age >= 13:", "age = 13", "print(age)", "for i in range(13):"], "why": "Selection uses if / else to choose what happens next."}, {"topic": "Iteration", "q": "Repeating instructions using a loop is called…", "options": ["Iteration", "Selection", "Sequence", "Assignment"], "why": "Iteration means repeating. Python uses for and while loops."}, {"topic": "Definite iteration", "q": "How many times does this loop print \"Hi\"?", "options": ["3", "2", "4", "It never stops"], "why": "range(3) gives 0, 1, 2: three times. A for loop with range is definite iteration.", "code": "for i in range(3):\n    print(\"Hi\")"}, {"topic": "Indefinite iteration", "q": "Which loop is indefinite iteration?", "options": ["while answer != \"stop\":", "for i in range(10):", "for letter in \"cat\":", "for i in range(1, 6):"], "why": "A while loop keeps going until a condition changes. You do not know how many times it will repeat."}, {"topic": "Nested (selection/iteration)", "q": "What is nested iteration or selection?", "options": ["A loop or if statement INSIDE another loop or if statement", "Two loops one after the other", "A loop that never stops", "An if statement with no else"], "why": "Nested means one inside another. The inside one is indented more."}, {"topic": "Identifier", "q": "In the line  player_score = 10 , what is the identifier?", "options": ["player_score", "10", "=", "player_score = 10"], "why": "The identifier is the NAME of the variable."}, {"topic": "Integer division (DIV)", "q": "What does this print?", "options": ["3", "3.4", "2", "5"], "why": "// is integer division in Python (DIV in pseudocode). 17 ÷ 5 = 3 remainder 2, so it keeps 3.", "code": "print(17 // 5)"}, {"topic": "Remainder (MOD)", "q": "What does this print?", "options": ["2", "3", "3.4", "0"], "why": "% is the remainder in Python (MOD in pseudocode). 17 ÷ 5 = 3 remainder 2.", "code": "print(17 % 5)"}, {"topic": "Remainder (MOD)", "q": "A number is even if number % 2 gives…", "options": ["0", "1", "2", "True"], "why": "Even numbers have no remainder when you divide by 2."}, {"topic": "Relational operator", "q": "Which of these is a relational operator?", "options": [">=", "and", "+", "="], "why": "Relational operators compare two values: == != < > <= >=. In Python, = is assignment, not compare."}, {"topic": "Boolean operator", "q": "Which of these are Boolean operators?", "options": ["AND, OR, NOT", "+, -, *", "<, >, ==", "for, while"], "why": "Boolean operators combine or change True/False conditions."}, {"topic": "Boolean operator", "q": "age = 15. What does this print?", "options": ["True", "False", "15", "Error"], "why": "age >= 13 is True and age <= 19 is True. True and True gives True.", "code": "age = 15\nprint(age >= 13 and age <= 19)"}, {"topic": "Concatenation", "q": "What does this print?", "options": ["Bangkok", "Bang kok", "Bang + kok", "Error"], "why": "+ joins strings together. This is concatenation.", "code": "print(\"Bang\" + \"kok\")"}, {"topic": "Substring", "q": "What does this print?", "options": ["Thai", "Thailand", "land", "T"], "why": "name[0:4] takes the characters from position 0 up to (not including) 4. This is a substring.", "code": "name = \"Thailand\"\nprint(name[0:4])"}], "cards": [{"term": "Algorithm", "meaning": "A sequence of specific instructions that solve a problem or complete a task.", "example": "Steps to find the biggest number in a list."}, {"term": "Decomposition", "meaning": "Breaking a big problem into smaller parts (sub-problems), so each part is easier to solve on its own.", "example": "Making a game: split it into moving, scoring and drawing."}, {"term": "Abstraction", "meaning": "Removing details that are not needed, so you can focus on the important parts of a problem.", "example": "A metro map shows the stations, not every street."}, {"term": "Pseudocode", "meaning": "A way of writing an algorithm using simple English-like instructions, instead of a real programming language.", "example": "IF age ≥ 13 THEN OUTPUT \"Teenager\""}, {"term": "Flowchart", "meaning": "A diagram that shows the steps of an algorithm using boxes and arrows. For example, a diamond shape means a decision (yes/no question).", "example": "Oval = start/end · rectangle = process · diamond = decision · parallelogram = input/output"}, {"term": "Trace table", "meaning": "A table used to follow a program step by step, to check what it does or find a value it produces.", "example": "One column for each variable, one row for each step."}, {"term": "Efficiency (of an algorithm)", "meaning": "How many steps an algorithm needs to finish. A more efficient algorithm needs fewer steps.", "example": "8 steps is more efficient than 50 steps."}, {"term": "Linear search", "meaning": "An algorithm that checks every item in a list, one at a time from the start, until it finds the target or reaches the end.", "example": "Looking for 20 in [3, 8, 12, 20]: check 3, then 8, then 12, then 20."}, {"term": "Binary search", "meaning": "An algorithm that finds an item in a SORTED list quickly, by repeatedly checking the middle item and ignoring half the list each time.", "example": "Looking for 20 in [3, 8, 12, 20, 25]: check the middle (12), 20 is bigger, so ignore the left half."}, {"term": "Data type", "meaning": "A category that tells the computer what kind of value is being stored, e.g. a whole number or a piece of text.", "example": "int, float, bool, str"}, {"term": "Integer", "meaning": "A data type for whole numbers, with no decimal point (e.g. 7, -3, 100).", "example": "age = 15"}, {"term": "Real number /float", "meaning": "A data type for numbers that can have a decimal point (e.g. 3.14). This is called a 'float' in Python.", "example": "price = 9.99"}, {"term": "Boolean", "meaning": "A data type that can only be one of two values: True or False.", "example": "is_raining = True"}, {"term": "Character", "meaning": "A data type for a single letter, digit, or symbol (e.g. 'A', '7', '!').", "example": "grade = \"A\""}, {"term": "String", "meaning": "A data type for a sequence of characters, i.e. text (e.g. \"Hello\").", "example": "name = \"Ploy\""}, {"term": "Variable", "meaning": "A named place in memory that stores a value which CAN change while the program runs.", "example": "score = score + 1"}, {"term": "Constant", "meaning": "A named value that stays the SAME for the whole program — it cannot be changed once set.", "example": "VAT_RATE = 0.07   (capital letters show it should not change)"}, {"term": "Assignment", "meaning": "Giving a variable a value, using an equals sign (e.g. score = 0).", "example": "score = 0"}, {"term": "Sequence", "meaning": "Instructions that run one after another, in the order they are written.", "example": "print(\"Hello\")  then  name = input()  then  print(name)"}, {"term": "Selection", "meaning": "Choosing what happens next based on a condition, using if / else.", "example": "if score >= 50:\n    print(\"Pass\")\nelse:\n    print(\"Try again\")"}, {"term": "Iteration", "meaning": "Repeating a set of instructions, using a loop (e.g. for or while).", "example": "for i in range(3):   or   while lives > 0:"}, {"term": "Definite iteration", "meaning": "A loop that repeats an exact, known number of times (e.g. a for loop).", "example": "for i in range(5):\n    print(i)"}, {"term": "Indefinite iteration", "meaning": "A loop that repeats until a condition becomes true or false — the number of repeats isn't fixed in advance (e.g. a while loop).", "example": "while answer != \"stop\":\n    answer = input()"}, {"term": "Nested (selection/iteration)", "meaning": "An if statement or loop placed INSIDE another if statement or loop.", "example": "for i in range(10):\n    if i % 2 == 0:\n        print(i)"}, {"term": "Identifier", "meaning": "The name given to a variable, constant, or subroutine, e.g. score or find_total.", "example": "score, find_total, player_name"}, {"term": "Integer division (DIV)", "meaning": "Division that only keeps the whole-number part of the answer and throws away the remainder (e.g. 11 DIV 2 = 5).", "example": "Python: 17 // 5 gives 3   (pseudocode: 17 DIV 5)"}, {"term": "Remainder (MOD)", "meaning": "The amount left over after integer division (e.g. 11 MOD 2 = 1).", "example": "Python: 17 % 5 gives 2   (pseudocode: 17 MOD 5)"}, {"term": "Relational operator", "meaning": "A symbol used to compare two values, e.g. = (equal to), ≠ (not equal to), < (less than), > (greater than).", "example": "Python: ==  !=  <  >  <=  >="}, {"term": "Boolean operator", "meaning": "A word used to combine or change True/False conditions: NOT, AND, OR.", "example": "if age > 12 and age < 20:"}, {"term": "Concatenation", "meaning": "Joining two or more strings together to make one longer string. Using a + sign.", "example": "\"Bang\" + \"kok\" gives \"Bangkok\""}, {"term": "Substring", "meaning": "A smaller piece of text taken from inside a longer string.", "example": "\"Thailand\"[0:4] gives \"Thai\""}], "gaps": [{"set": 1, "s": "An ___ is a sequence of instructions that solves a problem or completes a task.", "a": ["algorithm"]}, {"set": 1, "s": "Breaking a big problem into smaller sub-problems is called ___.", "a": ["decomposition"]}, {"set": 1, "s": "Removing details that are not needed is called ___.", "a": ["abstraction"]}, {"set": 1, "s": "___ is a way of writing an algorithm in simple English-like instructions.", "a": ["pseudocode"]}, {"set": 1, "s": "A ___ shows the steps of an algorithm with boxes and arrows.", "a": ["flowchart"]}, {"set": 1, "s": "A ___ is used to follow a program step by step.", "a": ["trace table"]}, {"set": 1, "s": "The ___ of an algorithm is how many steps it needs. Fewer steps is better.", "a": ["efficiency"]}, {"set": 1, "s": "A ___ checks every item in a list, one at a time, from the start.", "a": ["linear search"]}, {"set": 1, "s": "A ___ only works on a sorted list. It checks the middle item each time.", "a": ["binary search"]}, {"set": 2, "s": "A ___ tells the computer what kind of value is stored.", "a": ["data type"]}, {"set": 2, "s": "7 and -3 are whole numbers, so their data type is ___.", "a": ["integer"]}, {"set": 2, "s": "3.14 has a decimal point. In Python its data type is ___.", "a": ["float"]}, {"set": 2, "s": "True and False are the only two values of a ___.", "a": ["Boolean"]}, {"set": 2, "s": "'A', '7' and '!' are each a single ___.", "a": ["character"]}, {"set": 2, "s": "\"Hello\" is text, so its data type is ___.", "a": ["string"]}, {"set": 2, "s": "A ___ is a named place in memory. Its value CAN change.", "a": ["variable"]}, {"set": 2, "s": "A ___ has a value that stays the SAME for the whole program.", "a": ["constant"]}, {"set": 2, "s": "score = 0 is an example of ___.", "a": ["assignment"]}, {"set": 2, "s": "In score = 0, the name score is the ___.", "a": ["identifier"]}, {"set": 2, "s": "\"Bang\" + \"kok\" joins two strings. This is called ___.", "a": ["concatenation"]}, {"set": 2, "s": "\"Thai\" is a ___ of \"Thailand\".", "a": ["substring"]}, {"set": 3, "s": "Instructions that run one after another, in order, are called ___.", "a": ["sequence"]}, {"set": 3, "s": "Using if and else to choose what happens next is called ___.", "a": ["selection"]}, {"set": 3, "s": "Repeating instructions with a loop is called ___.", "a": ["iteration"]}, {"set": 3, "s": "for i in range(5): repeats exactly 5 times. This is ___.", "a": ["definite iteration"]}, {"set": 3, "s": "A while loop that repeats until the user types \"stop\" is ___.", "a": ["indefinite iteration"]}, {"set": 3, "s": "An if statement inside a loop is ___ selection.", "a": ["nested"]}, {"set": 3, "s": "17 // 5 gives 3. This is ___.", "a": ["integer division"]}, {"set": 3, "s": "17 % 5 gives 2. This is the ___.", "a": ["remainder"]}, {"set": 3, "s": "< , > and == are each a ___.", "a": ["relational operator"]}, {"set": 3, "s": "AND, OR and NOT are each a ___.", "a": ["Boolean operator"]}]};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// Tabs
const TIPS = {
  quiz: 'Answer each question. You will see if you are right straight away.',
  cards: 'Say the meaning out loud first. Then tap the card to check.',
  gaps: 'Choose a word from the word bank for each gap. Tap 🔊 to hear the sentence.'
};
function showTab(which){
  ['quiz', 'cards', 'gaps'].forEach(t => {
    $('#t' + t[0].toUpperCase() + t.slice(1)).setAttribute('aria-selected', which === t);
    $('#' + t).hidden = which !== t;
  });
  $('header p').textContent = TIPS[which];
}
$('#tQuiz').onclick = () => showTab('quiz');
$('#tCards').onclick = () => showTab('cards');
$('#tGaps').onclick = () => showTab('gaps');

// Quiz
let order, qi, score, missed, answered;
function startQuiz(){
  order = shuffle(DATA.questions.map((q, i) => i));
  qi = 0; score = 0; missed = []; renderQ();
}
function renderQ(){
  const q = DATA.questions[order[qi]];
  answered = false;
  const opts = shuffle(q.options.map((t, i) => ({ t, i })));
  $('#quiz').innerHTML = `
    <div class="progress"><span style="width:${(qi / order.length) * 100}%"></span></div>
    <p class="qnum">Question ${qi + 1} of ${order.length}</p>
    <p class="q">${esc(q.q)}</p>
    ${q.code ? `<pre>${esc(q.code)}</pre>` : ''}
    <div class="opts">${opts.map(o => `<button class="opt" data-i="${o.i}">${esc(o.t)}</button>`).join('')}</div>
    <div class="fb" id="fb" aria-live="polite"></div>
    <div class="row"><button class="btn" id="nextQ" hidden>${qi + 1 === order.length ? 'See my score' : 'Next question'}</button></div>`;
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(b, q));
  $('#nextQ').onclick = () => { qi++; qi < order.length ? renderQ() : renderEnd(); };
}
function choose(btn, q){
  if (answered) return;
  answered = true;
  const pick = +btn.dataset.i, ok = pick === 0;
  if (ok) score++; else missed.push(q.topic);
  document.querySelectorAll('.opt').forEach(b => {
    b.disabled = true;
    if (+b.dataset.i === 0) b.classList.add('right');
    else if (b === btn) b.classList.add('wrong');
  });
  const fb = $('#fb');
  fb.className = 'fb show ' + (ok ? 'right' : 'wrong');
  fb.innerHTML = `<b>${ok ? 'Correct!' : 'Not quite. The answer is: ' + esc(q.options[0])}</b>${esc(q.why)}`;
  const n = $('#nextQ'); n.hidden = false; n.focus();
}
function renderEnd(){
  const pct = Math.round(score / order.length * 100);
  const msg = pct >= 80 ? 'Great work. You know this well.' : pct >= 50 ? 'Good start. Revise the keywords below.' : 'Keep going. Use the flashcards, then try again.';
  const topics = [...new Set(missed)];
  $('#quiz').innerHTML = `
    <div class="progress"><span style="width:100%"></span></div>
    <p class="qnum">Your score</p>
    <p class="score">${score} / ${order.length}</p>
    <p>${msg}</p>
    ${topics.length ? `<p><b>Revise these keywords:</b></p><ul class="list">${topics.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : '<p>You got every question right!</p>'}
    <p><b>Write your score in Google Classroom.</b></p>
    <div class="row"><button class="btn ghost" id="toCards">Practise with flashcards</button><button class="btn" id="again">Try again</button></div>`;
  $('#again').onclick = startQuiz;
  $('#toCards').onclick = () => showTab('cards');
}

// Flashcards
let deck = DATA.cards.slice(), ci = 0, flipped = false;
function renderCard(){
  const c = deck[ci];
  $('#card').innerHTML = flipped
    ? `<div class="def">${esc(c.meaning)}</div>${c.example ? `<div class="ex">Example: ${esc(c.example)}</div>` : ''}`
    : `<div class="term">${esc(c.term)}</div><div class="hint">Tap to see the meaning</div>`;
  $('#cardCount').textContent = `Card ${ci + 1} of ${deck.length}`;
}
$('#card').onclick = () => { flipped = !flipped; renderCard(); };
$('#next').onclick = () => { ci = (ci + 1) % deck.length; flipped = false; renderCard(); };
$('#prev').onclick = () => { ci = (ci - 1 + deck.length) % deck.length; flipped = false; renderCard(); };
$('#shuf').onclick = () => { deck = shuffle(deck); ci = 0; flipped = false; renderCard(); };

startQuiz(); renderCard();

// Fill the gaps
const SETS = {1: 'Set 1: Algorithms', 2: 'Set 2: Data and variables', 3: 'Set 3: Loops, choices and operators'};
let GSET = 1, BANK = [];
function renderGaps(){
  BANK = shuffle([...new Set(DATA.gaps.filter(g => g.set === GSET).flatMap(g => g.a))]);
  $('#gapSets').innerHTML = Object.entries(SETS).map(([k, t]) => `<button class="btn ${+k === GSET ? '' : 'ghost'}" data-set="${k}" aria-pressed="${+k === GSET}">${esc(t)}</button>`).join('');
  document.querySelectorAll('[data-set]').forEach(b => b.onclick = () => { GSET = +b.dataset.set; renderGaps(); });
  $('#bank').innerHTML = BANK.map(w => `<span>${esc(w)}</span>`).join('');
  const opts = '<option value="">choose…</option>' + BANK.map(w => `<option>${esc(w)}</option>`).join('');
  $('#sents').innerHTML = DATA.gaps.map((g, i) => {
    if (g.set !== GSET) return '';
    const parts = g.s.split('___');
    let h = esc(parts[0]);
    for (let k = 1; k < parts.length; k++) h += `<select data-g="${i}" data-k="${k - 1}" aria-label="Gap ${k} in sentence ${i + 1}">${opts}</select>` + esc(parts[k]);
    return `<li>${h} <button class="say" data-g="${i}" aria-label="Listen to sentence ${i + 1}">🔊</button></li>`;
  }).join('');
  document.querySelectorAll('.say').forEach(b => b.onclick = () => speak(+b.dataset.g));
  document.querySelectorAll('#sents select').forEach(s => s.onchange = () => s.classList.remove('right', 'wrong'));
  const fb = $('#gapFb'); fb.className = 'fb'; fb.innerHTML = '';
}
function speak(i){
  if (!('speechSynthesis' in window)) return;
  const g = DATA.gaps[i], parts = g.s.split('___');
  const sels = [...document.querySelectorAll(`#sents select[data-g="${i}"]`)];
  let t = parts[0];
  for (let k = 1; k < parts.length; k++) t += ' ' + (sels[k - 1].value || 'blank') + ' ' + parts[k];
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t.replace(/[“”"]/g, ''));
  u.lang = 'en-GB'; u.rate = 0.85;
  speechSynthesis.speak(u);
}
$('#gapCheck').onclick = () => {
  let right = 0, total = 0, empty = 0;
  document.querySelectorAll('#sents select').forEach(s => {
    const ans = DATA.gaps[s.dataset.g].a[s.dataset.k];
    total++;
    s.classList.remove('right', 'wrong');
    if (!s.value) { empty++; return; }
    if (s.value === ans) { right++; s.classList.add('right'); } else s.classList.add('wrong');
  });
  const fb = $('#gapFb');
  fb.className = 'fb show ' + (right === total ? 'right' : 'wrong');
  fb.innerHTML = `<b>${right} out of ${total} correct.</b>` +
    (right === total ? 'Brilliant! Every gap is right.' :
     empty ? `You still have ${empty} empty gap${empty > 1 ? 's' : ''}. Orange gaps are wrong: try another word.` :
     'Orange gaps are wrong. Try another word, then check again.');
};
$('#gapShow').onclick = () => {
  document.querySelectorAll('#sents select').forEach(s => {
    s.value = DATA.gaps[s.dataset.g].a[s.dataset.k];
    s.classList.remove('wrong'); s.classList.add('right');
  });
  const fb = $('#gapFb'); fb.className = 'fb show right';
  fb.innerHTML = '<b>Answers shown.</b>Read each sentence out loud. Then press Start again and try without looking.';
};
$('#gapReset').onclick = renderGaps;
renderGaps();
</script>
</body>
</html>
