<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Year 9 Python Turtle – quiz and flashcards</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#1E2433; --muted:#566074; --paper:#F4F6FA; --card:#FCFDFE; --line:#D9DEE8;
  --accent:#2F7D32; --tint:#E1F1E2; --on-accent:#FCFDFE;
  --good:#1F6FB2; --good-bg:#E3EFFA; --bad:#B4530B; --bad-bg:#FCEBDC;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E9ECF3; --muted:#A7AFC0; --paper:#141925; --card:#1C2231; --line:#2E3647;
    --accent:#7CC77F; --tint:#252D3E; --on-accent:#141925;
    --good:#7DB8EC; --good-bg:#1C2B3D; --bad:#F2A767; --bad-bg:#3A2A1C;
  }
}
:root[data-theme="dark"]{
  --ink:#E9ECF3; --muted:#A7AFC0; --paper:#141925; --card:#1C2231; --line:#2E3647;
  --accent:#7CC77F; --tint:#252D3E; --on-accent:#141925;
  --good:#7DB8EC; --good-bg:#1C2B3D; --bad:#F2A767; --bad-bg:#3A2A1C;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.55 "Atkinson Hyperlegible",Verdana,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:28px 20px 56px}
header{border-left:6px solid var(--accent);padding:4px 0 4px 16px;margin-bottom:24px}
h1{font:700 clamp(28px,6vw,40px)/1.1 Rubik,Arial,sans-serif;margin:0 0 6px}
header p{margin:0;color:var(--muted)}
.tabs{display:flex;gap:8px;margin-bottom:20px}
.tab{flex:1;font:600 17px Rubik,Arial,sans-serif;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}
.progress{height:8px;background:var(--tint);border-radius:8px;overflow:hidden;margin-bottom:16px}
.progress span{display:block;height:100%;background:var(--accent);transition:width .3s}
.qnum{color:var(--muted);font-size:15px;margin:0 0 6px}
.q{font:600 22px/1.35 Rubik,Arial,sans-serif;margin:0 0 16px}
pre{background:var(--tint);border-radius:10px;padding:12px 14px;overflow-x:auto;font:16px/1.5 "Courier New",monospace;margin:0 0 16px;white-space:pre}
.opts{display:grid;gap:10px}
.opt{text-align:left;font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.fb{margin-top:16px;padding:14px 16px;border-radius:12px;display:none}
.fb.show{display:block}
.fb.right{background:var(--good-bg);border-left:5px solid var(--good)}
.fb.wrong{background:var(--bad-bg);border-left:5px solid var(--bad)}
.fb b{display:block;margin-bottom:4px}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.btn{font:600 17px Rubik,Arial,sans-serif;padding:12px 20px;border-radius:12px;border:none;background:var(--accent);color:var(--on-accent);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn[hidden]{display:none}
.score{font:700 64px/1 Rubik,Arial,sans-serif;color:var(--accent);margin:8px 0}
.list{padding-left:20px}
.card{min-height:260px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px;border-radius:16px;background:var(--tint);cursor:pointer;border:2px solid transparent;width:100%;font:inherit;color:var(--ink)}
.card .term{font:700 clamp(28px,7vw,40px)/1.15 Rubik,Arial,sans-serif}
.card .hint{color:var(--muted);font-size:15px;margin-top:14px}
.card .def{font-size:20px}
.card .ex{margin-top:14px;color:var(--muted)}
.count{text-align:center;color:var(--muted);margin-top:12px}
.tabs{flex-wrap:wrap}
.tab{min-width:120px}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;padding:14px;background:var(--tint);border-radius:12px}
.bank span{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-weight:700}
.sents{padding-left:24px;margin:0;display:grid;gap:14px}
.sents li{line-height:2.1}
.sents select{font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:8px;padding:2px 6px;max-width:100%}
.sents select.right{border-color:var(--good);background:var(--good-bg)}
.sents select.wrong{border-color:var(--bad);background:var(--bad-bg)}
.say{font:inherit;background:none;border:none;cursor:pointer;padding:0 4px;color:var(--accent)}
@media (prefers-reduced-motion:reduce){.progress span{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Year 9 Python Turtle revision</h1>
    <p>Answer each question. You will see if you are right straight away.</p>
  </header>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tQuiz" aria-selected="true">Quiz</button>
    <button class="tab" role="tab" id="tCards" aria-selected="false">Flashcards</button>
    <button class="tab" role="tab" id="tGaps" aria-selected="false">Fill the gaps</button>
  </div>

  <section class="panel" id="quiz"></section>

  <section class="panel" id="cards" hidden>
    <button class="card" id="card" aria-live="polite"></button>
    <p class="count" id="cardCount"></p>
    <div class="row" style="justify-content:space-between">
      <button class="btn ghost" id="prev">Back</button>
      <button class="btn ghost" id="shuf">Shuffle</button>
      <button class="btn" id="next">Next card</button>
    </div>
  </section>

  <section class="panel" id="gaps" hidden>
    <p class="qnum">Word bank</p>
    <div class="bank" id="bank"></div>
    <ol class="sents" id="sents"></ol>
    <div class="fb" id="gapFb" aria-live="polite"></div>
    <div class="row">
      <button class="btn ghost" id="gapReset">Start again</button>
      <button class="btn ghost" id="gapShow">Show answers</button>
      <button class="btn" id="gapCheck">Check my answers</button>
    </div>
  </section>
</div>

<script>
const DATA = {"questions": [{"topic": "import turtle", "q": "What must the first line of a turtle program be?", "options": ["import turtle", "turtle.start()", "begin_fill()", "for i in range(4):"], "why": "import turtle brings in the turtle module so its commands will work."}, {"topic": "forward / backward", "q": "What does turtle.forward(100) do?", "options": ["Moves the turtle 100 steps in the direction it is facing", "Turns the turtle 100 degrees", "Draws a circle with radius 100", "Moves the turtle to x = 100"], "why": "forward(x) moves the turtle x steps in the direction it is facing."}, {"topic": "Turning angle rule", "q": "What angle should the turtle turn to draw a square?", "options": ["90", "60", "120", "360"], "why": "360 ÷ 4 sides = 90°."}, {"topic": "Turning angle rule", "q": "What angle should the turtle turn to draw a regular hexagon (6 sides)?", "options": ["60", "90", "120", "36"], "why": "360 ÷ 6 sides = 60°."}, {"topic": "Turning angle rule", "q": "Look at the code. What shape does it draw?", "code": "for i in range(5):\n    turtle.forward(100)\n    turtle.right(72)", "options": ["A pentagon", "A square", "A hexagon", "A circle"], "why": "It repeats 5 times and turns 72° (360 ÷ 5), so it draws a 5-sided shape."}, {"topic": "for i in range(n)", "q": "How many times does the code inside for i in range(4): run?", "options": ["4", "3", "5", "It never stops"], "why": "range(4) repeats the code exactly 4 times."}, {"topic": "begin_fill / end_fill", "q": "How do you colour in a shape?", "options": ["Put begin_fill() before the shape and end_fill() after it", "Put end_fill() before the shape", "Use penup() before the shape", "Use circle() after the shape"], "why": "The shape is coloured in between begin_fill() and end_fill()."}, {"topic": "penup / pendown", "q": "You want to move the turtle without drawing a line. Which is correct?", "options": ["penup() → goto(-100, 150) → pendown()", "pendown() → goto(-100, 150) → penup()", "begin_fill() → goto(-100, 150) → end_fill()", "goto(-100, 150) only"], "why": "penup lifts the pen so no line is drawn. pendown puts it back for the next shape."}, {"topic": "goto(x, y)", "q": "Where does turtle.goto(0, 0) send the turtle?", "options": ["The centre of the screen", "The top left corner", "100 steps forward", "Off the screen"], "why": "(0, 0) is the centre of the turtle screen."}, {"topic": "random.randint", "q": "Which numbers can random.randint(1, 8) give?", "options": ["Any whole number from 1 to 8", "Only 1 or 8", "Any number from 1 to 7", "Decimal numbers like 2.5"], "why": "randint picks a random whole number, and both ends (1 and 8) are included."}, {"topic": "if statement", "q": "When does the code under if x > 400: run?", "options": ["Only when x is more than 400", "Always", "Only when x is 400", "Only when x is less than 400"], "why": "An if statement runs code only when the condition is true."}, {"topic": "Debugging", "q": "Your two shapes are joined by a line you did not want. What is the most likely fix?", "options": ["Add penup() before moving and pendown() after", "Add another end_fill()", "Change right(90) to left(90)", "Delete import turtle"], "why": "Without penup(), the turtle draws a line as it moves between shapes."}, {"topic": "Syntax / indentation errors", "q": "for i in range(4)   ← this line has no colon at the end. What kind of error is this?", "options": ["Syntax error", "Indentation error", "It is correct", "Random error"], "why": "A missing colon breaks Python's rules for how code must be written: a syntax error."}, {"topic": "Syntax / indentation errors", "q": "The lines inside a for loop are not moved in (indented). What kind of error is this?", "options": ["Indentation error", "Syntax error in the brackets", "A fill error", "No error"], "why": "Python uses indentation to know which lines are inside the loop."}], "cards": [{"term": "import turtle", "meaning": "Brings in the turtle module so its commands will work.", "example": "Always the first line of the program."}, {"term": "forward(x) / backward(x)", "meaning": "Moves the turtle x steps in the direction it's facing.", "example": "turtle.forward(100)"}, {"term": "right(x) / left(x)", "meaning": "Turns the turtle x degrees.", "example": "turtle.right(90)"}, {"term": "for i in range(n):", "meaning": "Repeats the code inside exactly n times.", "example": "for i in range(4): → runs 4 times."}, {"term": "Turning angle rule", "meaning": "360 ÷ number of sides = the turn needed for a regular polygon.", "example": "Triangle: 360÷3 = 120°. Hexagon: 360÷6 = 60°."}, {"term": "begin_fill() / end_fill()", "meaning": "Colours in the shape drawn between them.", "example": "fillcolor(“blue”) → begin_fill() → draw shape → end_fill()."}, {"term": "penup() / pendown()", "meaning": "penup lifts the pen (no line drawn); pendown puts it back down.", "example": "penup() → goto(-100,150) → pendown()."}, {"term": "goto(x, y)", "meaning": "Moves the turtle to an exact coordinate on the screen.", "example": "turtle.goto(0, 0) → back to the centre."}, {"term": "circle(radius)", "meaning": "Draws a circle with that radius.", "example": "turtle.circle(50)"}, {"term": "random.randint(a, b)", "meaning": "Picks a random whole number between a and b.", "example": "forward(random.randint(1, 8))"}, {"term": "if statement", "meaning": "Runs code only when a condition is true.", "example": "if x > 400: (turtle has crossed the line)."}, {"term": "Debugging", "meaning": "Finding why code doesn't do what you expect.", "example": "Two shapes overlap because the turtle was never moved between them."}], "gaps": [{"s": "The first line of a turtle program is: ___ turtle", "a": ["import"]}, {"s": "turtle.___(100) moves the turtle 100 steps in the direction it is facing.", "a": ["forward"]}, {"s": "turtle.___(90) turns the turtle 90 degrees to the right.", "a": ["right"]}, {"s": "for i in ___(4): repeats the code exactly 4 times.", "a": ["range"]}, {"s": "To find the turn for a regular shape, do 360 ÷ the number of ___.", "a": ["sides"]}, {"s": "A hexagon has 6 sides, so the turtle turns ___ degrees.", "a": ["60"]}, {"s": "Put ___ before a shape and ___ after it to colour it in.", "a": ["begin_fill()", "end_fill()"]}, {"s": "___ lifts the pen, so the turtle moves without drawing a line.", "a": ["penup()"]}, {"s": "goto(0, 0) moves the turtle to the ___ of the screen.", "a": ["centre"]}, {"s": "random.___(1, 8) picks a random whole number from 1 to 8.", "a": ["randint"]}, {"s": "An ___ statement runs code only when a condition is true.", "a": ["if"]}, {"s": "A missing colon causes a ___ error. Lines that are not moved in cause an ___ error.", "a": ["syntax", "indentation"]}]};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// Tabs
const TIPS = {
  quiz: 'Answer each question. You will see if you are right straight away.',
  cards: 'Say the meaning out loud first. Then tap the card to check.',
  gaps: 'Choose a word from the word bank for each gap. Tap 🔊 to hear the sentence.'
};
function showTab(which){
  ['quiz', 'cards', 'gaps'].forEach(t => {
    $('#t' + t[0].toUpperCase() + t.slice(1)).setAttribute('aria-selected', which === t);
    $('#' + t).hidden = which !== t;
  });
  $('header p').textContent = TIPS[which];
}
$('#tQuiz').onclick = () => showTab('quiz');
$('#tCards').onclick = () => showTab('cards');
$('#tGaps').onclick = () => showTab('gaps');

// Quiz
let order, qi, score, missed, answered;
function startQuiz(){
  order = shuffle(DATA.questions.map((q, i) => i));
  qi = 0; score = 0; missed = []; renderQ();
}
function renderQ(){
  const q = DATA.questions[order[qi]];
  answered = false;
  const opts = shuffle(q.options.map((t, i) => ({ t, i })));
  $('#quiz').innerHTML = `
    <div class="progress"><span style="width:${(qi / order.length) * 100}%"></span></div>
    <p class="qnum">Question ${qi + 1} of ${order.length}</p>
    <p class="q">${esc(q.q)}</p>
    ${q.code ? `<pre>${esc(q.code)}</pre>` : ''}
    <div class="opts">${opts.map(o => `<button class="opt" data-i="${o.i}">${esc(o.t)}</button>`).join('')}</div>
    <div class="fb" id="fb" aria-live="polite"></div>
    <div class="row"><button class="btn" id="nextQ" hidden>${qi + 1 === order.length ? 'See my score' : 'Next question'}</button></div>`;
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(b, q));
  $('#nextQ').onclick = () => { qi++; qi < order.length ? renderQ() : renderEnd(); };
}
function choose(btn, q){
  if (answered) return;
  answered = true;
  const pick = +btn.dataset.i, ok = pick === 0;
  if (ok) score++; else missed.push(q.topic);
  document.querySelectorAll('.opt').forEach(b => {
    b.disabled = true;
    if (+b.dataset.i === 0) b.classList.add('right');
    else if (b === btn) b.classList.add('wrong');
  });
  const fb = $('#fb');
  fb.className = 'fb show ' + (ok ? 'right' : 'wrong');
  fb.innerHTML = `<b>${ok ? 'Correct!' : 'Not quite. The answer is: ' + esc(q.options[0])}</b>${esc(q.why)}`;
  const n = $('#nextQ'); n.hidden = false; n.focus();
}
function renderEnd(){
  const pct = Math.round(score / order.length * 100);
  const msg = pct >= 80 ? 'Great work. You know this well.' : pct >= 50 ? 'Good start. Revise the keywords below.' : 'Keep going. Use the flashcards, then try again.';
  const topics = [...new Set(missed)];
  $('#quiz').innerHTML = `
    <div class="progress"><span style="width:100%"></span></div>
    <p class="qnum">Your score</p>
    <p class="score">${score} / ${order.length}</p>
    <p>${msg}</p>
    ${topics.length ? `<p><b>Revise these keywords:</b></p><ul class="list">${topics.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : '<p>You got every question right!</p>'}
    <p><b>Write your score on your exit ticket in Google Classroom.</b></p>
    <div class="row"><button class="btn ghost" id="toCards">Practise with flashcards</button><button class="btn" id="again">Try again</button></div>`;
  $('#again').onclick = startQuiz;
  $('#toCards').onclick = () => showTab('cards');
}

// Flashcards
let deck = DATA.cards.slice(), ci = 0, flipped = false;
function renderCard(){
  const c = deck[ci];
  $('#card').innerHTML = flipped
    ? `<div class="def">${esc(c.meaning)}</div>${c.example ? `<div class="ex">Example: ${esc(c.example)}</div>` : ''}`
    : `<div class="term">${esc(c.term)}</div><div class="hint">Tap to see the meaning</div>`;
  $('#cardCount').textContent = `Card ${ci + 1} of ${deck.length}`;
}
$('#card').onclick = () => { flipped = !flipped; renderCard(); };
$('#next').onclick = () => { ci = (ci + 1) % deck.length; flipped = false; renderCard(); };
$('#prev').onclick = () => { ci = (ci - 1 + deck.length) % deck.length; flipped = false; renderCard(); };
$('#shuf').onclick = () => { deck = shuffle(deck); ci = 0; flipped = false; renderCard(); };

startQuiz(); renderCard();

// Fill the gaps
const BANK = shuffle([...new Set(DATA.gaps.flatMap(g => g.a))]);
function renderGaps(){
  $('#bank').innerHTML = BANK.map(w => `<span>${esc(w)}</span>`).join('');
  const opts = '<option value="">choose…</option>' + BANK.map(w => `<option>${esc(w)}</option>`).join('');
  $('#sents').innerHTML = DATA.gaps.map((g, i) => {
    const parts = g.s.split('___');
    let h = esc(parts[0]);
    for (let k = 1; k < parts.length; k++) h += `<select data-g="${i}" data-k="${k - 1}" aria-label="Gap ${k} in sentence ${i + 1}">${opts}</select>` + esc(parts[k]);
    return `<li>${h} <button class="say" data-g="${i}" aria-label="Listen to sentence ${i + 1}">🔊</button></li>`;
  }).join('');
  document.querySelectorAll('.say').forEach(b => b.onclick = () => speak(+b.dataset.g));
  document.querySelectorAll('#sents select').forEach(s => s.onchange = () => s.classList.remove('right', 'wrong'));
  const fb = $('#gapFb'); fb.className = 'fb'; fb.innerHTML = '';
}
function speak(i){
  if (!('speechSynthesis' in window)) return;
  const g = DATA.gaps[i], parts = g.s.split('___');
  const sels = [...document.querySelectorAll(`#sents select[data-g="${i}"]`)];
  let t = parts[0];
  for (let k = 1; k < parts.length; k++) t += ' ' + (sels[k - 1].value || 'blank') + ' ' + parts[k];
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t.replace(/[“”"]/g, ''));
  u.lang = 'en-GB'; u.rate = 0.85;
  speechSynthesis.speak(u);
}
$('#gapCheck').onclick = () => {
  let right = 0, total = 0, empty = 0;
  document.querySelectorAll('#sents select').forEach(s => {
    const ans = DATA.gaps[s.dataset.g].a[s.dataset.k];
    total++;
    s.classList.remove('right', 'wrong');
    if (!s.value) { empty++; return; }
    if (s.value === ans) { right++; s.classList.add('right'); } else s.classList.add('wrong');
  });
  const fb = $('#gapFb');
  fb.className = 'fb show ' + (right === total ? 'right' : 'wrong');
  fb.innerHTML = `<b>${right} out of ${total} correct.</b>` +
    (right === total ? 'Brilliant! Every gap is right.' :
     empty ? `You still have ${empty} empty gap${empty > 1 ? 's' : ''}. Orange gaps are wrong: try another word.` :
     'Orange gaps are wrong. Try another word, then check again.');
};
$('#gapShow').onclick = () => {
  document.querySelectorAll('#sents select').forEach(s => {
    s.value = DATA.gaps[s.dataset.g].a[s.dataset.k];
    s.classList.remove('wrong'); s.classList.add('right');
  });
  const fb = $('#gapFb'); fb.className = 'fb show right';
  fb.innerHTML = '<b>Answers shown.</b>Read each sentence out loud. Then press Start again and try without looking.';
};
$('#gapReset').onclick = renderGaps;
renderGaps();
</script>
</body>
</html>
